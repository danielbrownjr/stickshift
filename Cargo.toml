[package]
name = "stickshift"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Safe-Rust pocket diagnostics for M5Stack StickS3"

[features]
default = []
firmware = ["dep:esp-idf-hal", "dep:esp-idf-sys", "dep:log", "dep:esp-idf-svc"]
boot-diagnostic = ["dep:esp-idf-sys"]
lcd-preview = ["firmware", "dep:embedded-hal"]
lcd-l3b-low = []
lcd-l3b-high = []

[dependencies]
esp-idf-hal = { version = "0.47", optional = true }
esp-idf-sys = { version = "0.38", optional = true, features = ["binstart"] }
esp-idf-svc = { version = "0.53", optional = true }
log = { version = "0.4", optional = true }
font8x8 = { version = "0.3", default-features = false, features = ["unicode"] }
embedded-hal = { version = "1", optional = true }

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

[[bin]]
name = "stickshift"
path = "src/bin/stickshift.rs"
required-features = ["firmware"]

[[bin]]
name = "boot-diagnostic"
path = "src/bin/boot_diagnostic.rs"
required-features = ["boot-diagnostic"]
