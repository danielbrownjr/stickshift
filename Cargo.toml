[package]
name = "stickshift"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Safe-Rust pocket diagnostics for M5Stack StickS3"

[features]
default = []
firmware = ["dep:esp-idf-hal", "dep:esp-idf-sys", "dep:log", "dep:esp-idf-svc"]

[dependencies]
esp-idf-hal = { version = "0.47", optional = true }
esp-idf-sys = { version = "0.38", optional = true, features = ["binstart"] }
esp-idf-svc = { version = "0.52", optional = true }
log = { version = "0.4", optional = true }

[build-dependencies]
embuild = "0.33"

[[bin]]
name = "stickshift"
path = "src/bin/stickshift.rs"
required-features = ["firmware"]
